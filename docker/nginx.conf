# Production : fichiers statiques Vite servis par nginx (gzip, cache long sur les assets hachés, en-têtes de sécurité).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml application/octet-stream;

  # fichiers hachés : immuables
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # médias lourds non hachés : 30 jours
  location ~ ^/(textures|decor|hdri|icons)/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # jamais en cache : page d'entrée, service worker, manifest
  location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security-headers.inc; }
  location = /sw.js { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security-headers.inc; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security-headers.inc; }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security-headers.inc;
  }
}
