name: potato-cutter
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: potato-cutter-api
    volumes:
      - api_data:/data
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    image: potato-cutter-dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      default:
        aliases: [vite]
    environment:
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 20
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ipc: host
    environment:
      HOME: /tmp
      CI: "1"
      MAKE_OG: "${MAKE_OG:-}"
      BASE_URL: "http://vite:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      app:
        condition: service_healthy
    command: npx playwright test
  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args:
        SITE_URL: "${SITE_URL:-http://localhost:8080}"
    image: potato-cutter-prod
    depends_on:
      - api
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"   # « :80 » en local ; un nom de domaine active le HTTPS automatique
      AUTO_HTTPS: "${AUTO_HTTPS:-off}"
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - caddy_data:/data
volumes:
  node_modules:
  api_data:
  caddy_data:
