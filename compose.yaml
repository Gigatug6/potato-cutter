name: potato-cutter
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    image: potato-cutter-dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 20
volumes:
  node_modules:
